name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22"]
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
      - name: JavaScript tests (includes JS/PHP parity)
        run: node --test
      - name: PHP tests
        run: php tests/php/run.php
      - name: PHP lint
        run: for f in php/src/*.php wordpress/nepali-unicode-converter/*.php; do php -l "$f"; done
      - name: WordPress plugin copies are in sync
        run: sh scripts/sync-wordpress.sh --check
